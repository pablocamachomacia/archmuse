# NINGUNA provincia española tiene competencia normativa en edificación. Están
# aquí porque el usuario las declara y porque desambiguan homónimos
# ("Villanueva de..." aparece en varias provincias), no porque aporten reglas.
# Por eso tampoco existe un nivel de directorio de provincia en el corpus.
