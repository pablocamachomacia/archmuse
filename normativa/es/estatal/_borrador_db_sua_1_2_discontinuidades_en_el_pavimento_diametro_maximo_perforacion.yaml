  literal: "2 Discontinuidades en el pavimento \n1 Excepto en zonas de uso restringido\
    \ o exteriores y con el fin de limitar el riesgo de caídas como co n-\nsecuencia\
    \ de traspiés o de tropiezos, el suelo debe cumplir las condiciones siguientes:\
    \ \fDocumento Básico SUA Seguridad de utilización y accesibilidad \nSUA 1. Seguridad\
    \ frente al riesgo de caídas \n9 \na) No tendrá juntas que presenten un resalto\
    \ de más de 4 mm. Los elementos salientes del nivel \ndel pavimento, puntuales\
    \ y de pequeña dimensión (por ejemplo, los cerraderos de puertas) no \ndeben sobresalir\
    \ del pavimento más de 12 mm y el saliente que exceda de 6 mm en sus caras \n\
    enfrentadas al sentido de circulación de las personas no debe formar un ángulo\
    \ con el p avimen-\nto que exceda de 45º. \nb) Los desniveles que no excedan de\
    \ 5 cm se resolv erán con una pendiente que no exceda del \n25%;  \nc) En zonas\
    \ para circulación de personas, el suelo no presentará perforaciones o huecos\
    \ por los \nque pueda introducirse una esfera de 1,5 cm de diámetro. \n2 Cuando\
    \ se dispongan barreras para delimitar zonas de c irculación, tendrán una altura\
    \ de 80 cm c o-\nmo mínimo.  \n3 En zonas de circulación no se podrá disponer\
    \ un escalón aislado, ni dos consecutivos, exce pto en \nlos casos siguientes.\
    \ \na) en zonas de uso restringido; \nb) en las zonas comunes de los edificios\
    \ de uso Residencial Vivienda; \nc) en los accesos y en las salidas de los edificios;\
    \ \nd) en el acceso a un estrado o escenario. \nEn estos casos, si la zona de\
    \ circulación incluye un itinerario accesible, el o los escalones no podrán \n\
