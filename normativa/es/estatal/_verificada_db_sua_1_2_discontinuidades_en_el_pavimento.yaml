  mensaje: No tendrá juntas que presenten un resalto de más de 4 mm.
  explicacion_tecnica: 'El artículo establece tres bloques de exigencias sobre discontinuidades
    en el pavimento:


    **Bloque 1 (párrafo 1)** — Condiciones del suelo en zonas no restringidas ni exteriores:

    - (a) Resaltos en juntas: ≤ 4 mm. Elementos salientes puntuales: ≤ 12 mm sobre
    el pavimento; si el saliente supera 6 mm en la cara enfrentada al sentido de circulación,
    el ángulo con el pavimento no puede exceder 45º.

    - (b) Desniveles ≤ 5 cm: pendiente máxima del 25%.

    - (c) Sin perforaciones por las que pueda introducirse una esfera de 1,5 cm de
    diámetro.


    **Bloque 2 (párrafo 2)** — Barreras delimitadoras de zonas de circulación: altura
    mínima de 80 cm.


    **Bloque 3 (párrafo 3)** — Prohibición de escalón aislado o dos consecutivos en
    zonas de circulación, con cuatro excepciones tasadas. En los casos exceptuados,
    si existe itinerario accesible, los escalones no pueden disponerse en él.'
  explicacion_cliente: Aplica a suelos de zonas de circulación de personas, EXCEPTO
    en zonas de uso restringido o exteriores (para las condiciones del apartado 1).
    Las condiciones del apartado 3 sobre escalones aislados aplican a todas las zonas
    de circulación, con las excepciones listadas (uso restringido, zonas comunes de
    Residencial Vivienda, accesos/salidas de edificios, acceso a estrado o escenario).
