    acumulativas para los casos en que el acristalamiento no sea practicable ni fácilmente
    desmontable desde el interior: (a) restricción geométrica de alcance: toda la
    superficie exterior debe quedar dentro de un radio de 0,85 m desde algún punto
    del borde de la zona practicable, siendo ese punto de referencia a una altura
    no mayor de 1,30 m; (b) los acristalamientos reversibles deben disponer de dispositivo
    de bloqueo en posición invertida durante la limpieza.'
