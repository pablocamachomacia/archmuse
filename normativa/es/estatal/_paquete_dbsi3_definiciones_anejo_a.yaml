  literal: |-
    Anejo SI A. Terminología

    Espacio exterior seguro

    Es aquel en el que se puede dar por finalizada la evacuación de los
    ocupantes del edificio, debido a que cumple las siguientes condiciones:

    1 Permite la dispersión de los ocupantes que abandonan el edificio, en
    condiciones de seguridad.

    2 Se puede considerar que dicha condición se cumple cuando el espacio
    exterior tiene, delante de cada salida de edificio que comunique con él,
    una superficie de al menos 0,5P m² dentro de la zona delimitada con un
    radio 0,1P m de distancia desde la salida de edificio, siendo P el número
    de ocupantes cuya evacuación esté prevista por dicha salida. Cuando P no
    exceda de 50 personas no es necesario comprobar dicha condición.

    3 Si el espacio considerado no está comunicado con la red viaria o con
    otros espacios abiertos no puede considerarse ninguna zona situada a menos
    de 15 m de cualquier parte del edificio, excepto cuando está dividido en
    sectores de incendio estructuralmente independientes entre sí y con
    salidas también independientes al espacio exterior, en cuyo caso dicha
    distancia se podrá aplicar únicamente respecto del sector afectado por un
    posible incendio.

    4 Permite una amplia disipación del calor, del humo y de los gases
    producidos por el incendio.

    5 Permite el acceso de los efectivos de bomberos y de los medios de ayuda
    a los ocupantes que, en cada caso, se consideren necesarios.

    Recorrido de evacuación

    Recorrido que conduce desde un origen de evacuación hasta una salida de
    planta, situada en la misma planta considerada o en otra, o hasta una
    salida de edificio. Conforme a ello, una vez alcanzada una salida de
    planta, la longitud del recorrido posterior no computa a efectos del
    cumplimiento de los límites a los recorridos de evacuación.

    La longitud de los recorridos por pasillos, escaleras y rampas, se medirá
    sobre el eje de los mismos. No se consideran válidos los recorridos por
    escaleras mecánicas, ni aquellos en los que existan tornos u otros
    elementos que puedan dificultar el paso.

    Salida de edificio

    Puerta o hueco de salida a un espacio exterior seguro. En el caso de
    salidas previstas para un máximo de 500 personas puede admitirse como
    salida de edificio aquella que comunique con un espacio exterior que
    disponga de dos recorridos alternativos hasta dos espacios exteriores
    seguros, uno de los cuales no exceda de 50 m.

    Salida de planta

    Es alguno de los siguientes elementos, pudiendo estar situada bien en la
    planta considerada o bien en otra planta diferente:

    1 El arranque de una escalera compartimentada como los sectores de
    incendio, o una puerta de acceso a una escalera protegida, a un pasillo
    protegido o al vestíbulo de independencia de una escalera especialmente
    protegida.
  vigencia:
    vigencia_desde: 2006-03-29

